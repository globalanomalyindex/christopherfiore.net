document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"f92db1a2-e4d0-49d7-b00a-1c1258085cbe\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet data-dc-atomics=\"\">\n<meta name=\"design_doc_mode\" content=\"canvas\">\n<style>/* Fiore — webfonts\n   Two families, Regular weight only (as supplied). No bold cuts exist:\n   build hierarchy with scale, case, color and tracking — never faux-bold. */\n\n@font-face{\n  font-family:\"Dessign Maison\";\n  src:url(\"6afe7506-e4b0-4148-9fb2-f020367201a5\") format(\"opentype\");\n  font-weight:400;font-style:normal;font-display:swap;\n}\n@font-face{\n  font-family:\"Karrik\";\n  src:url(\"209451dc-b9df-40e4-9296-0281a04e106b\") format(\"opentype\");\n  font-weight:400;font-style:normal;font-display:swap;\n}\n<\u002Fstyle>\n<style>/* Fiore — color\n   A collected palette, not a single brand hue. Warm stone neutrals hold the\n   room; a curated set of twelve mineral accents behaves like a bag of\n   specimens — each distinct, all coherent. Composition (ratio + adjacency) is\n   the point, so treat minerals as a collection to draw from, with Lapis as\n   the one interactive primary. */\n:root{\n  /* ---- Stone: warm neutral ramp (hue ~80, low chroma) ---- */\n  --stone-0:#FBFAF6;   /* card / raised paper            */\n  --stone-50:#F4F0E7;  /* page                           */\n  --stone-100:#ECE7DB; /* sunken / hover wash            */\n  --stone-200:#DED7C7; /* hairline border                */\n  --stone-300:#C8BFAB; /* default border                 */\n  --stone-400:#A69C87; /* strong border / disabled text  */\n  --stone-500:#837A67; /* subtle text                    */\n  --stone-600:#635B4B; /* muted text                     */\n  --stone-700:#423C31; /* body on dark surfaces          */\n  --stone-800:#2A251D; /* strong body                    */\n  --stone-900:#17140F; /* ink — warm near-black          */\n\n  /* ---- The mineral collection: base + light wash for each ---- */\n  --lapis:#2B4B8F;      --lapis-wash:#DDE2F1;      /* deep blue   (primary) */\n  --malachite:#1E7355;  --malachite-wash:#D7E7DF;  /* green       (success) */\n  --amethyst:#6A49A0;   --amethyst-wash:#E4DCF1;   /* purple      (accent)  */\n  --carnelian:#B8462C;  --carnelian-wash:#F1DBD1;  /* red-orange  (danger)  */\n  --citrine:#CE9126;    --citrine-wash:#F5E8CC;    /* amber       (warning) */\n  --rose:#C27C79;       --rose-wash:#F1E0DE;       /* rose quartz           */\n  --turquoise:#2C8F93;  --turquoise-wash:#D4E9E9;  /* teal        (info)    */\n  --azurite:#3363B0;    --azurite-wash:#DBE4F4;    /* bright blue           */\n  --jade:#7FA98C;       --jade-wash:#E0EBE3;       /* pale green            */\n  --sulfur:#E0C23F;     --sulfur-wash:#F7EFC9;     /* bright yellow         */\n  --pyrite:#97742E;     --pyrite-wash:#EEE6D0;     /* brass                 */\n  --hematite:#6E4B44;   --hematite-wash:#EADDD9;   /* oxide brown           */\n\n  /* ---- Semantic surfaces ---- */\n  --surface-page:var(--stone-50);\n  --surface-card:var(--stone-0);\n  --surface-sunken:var(--stone-100);\n  --surface-hover:var(--stone-100);\n  --surface-inverse:var(--stone-900);\n  --surface-scrim:color-mix(in oklab, var(--stone-900) 55%, transparent);\n\n  /* ---- Text ---- */\n  --text-strong:var(--stone-900);\n  --text-body:var(--stone-800);\n  --text-muted:var(--stone-600);\n  --text-subtle:var(--stone-500);\n  --text-disabled:var(--stone-400);\n  --text-inverse:var(--stone-50);\n  --text-link:var(--lapis);\n  --text-link-hover:color-mix(in oklab, var(--lapis) 78%, var(--stone-900));\n\n  /* ---- Borders / dividers ---- */\n  --border-hairline:var(--stone-200);\n  --border-default:var(--stone-300);\n  --border-strong:var(--stone-400);\n  --border-inverse:color-mix(in oklab, var(--stone-50) 22%, transparent);\n\n  /* ---- Interactive: primary = Lapis ---- */\n  --color-primary:var(--lapis);\n  --color-primary-hover:color-mix(in oklab, var(--lapis) 88%, var(--stone-900));\n  --color-primary-active:color-mix(in oklab, var(--lapis) 78%, var(--stone-900));\n  --color-primary-wash:var(--lapis-wash);\n  --text-on-primary:var(--stone-0);\n\n  /* ---- Semantic status (mapped onto the collection) ---- */\n  --color-success:var(--malachite); --color-success-wash:var(--malachite-wash); --text-on-success:var(--stone-0);\n  --color-warning:var(--citrine);   --color-warning-wash:var(--citrine-wash);   --text-on-warning:var(--stone-900);\n  --color-danger:var(--carnelian);  --color-danger-wash:var(--carnelian-wash);  --text-on-danger:var(--stone-0);\n  --color-info:var(--turquoise);    --color-info-wash:var(--turquoise-wash);    --text-on-info:var(--stone-0);\n  --color-accent:var(--amethyst);   --color-accent-wash:var(--amethyst-wash);   --text-on-accent:var(--stone-0);\n\n  /* ---- Focus ---- */\n  --focus-ring:color-mix(in oklab, var(--lapis) 45%, transparent);\n  --focus-ring-width:3px;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#F5F3EC;font-family:Karrik,system-ui,sans-serif}\na{color:#274D8F}a:hover{color:#17140F}\n.dv-turn{padding:40px 44px 32px;border-bottom:1px solid rgba(23,20,15,.08);scroll-margin-top:16px}\n.dv-thd{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}\n.dv-tid{font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#17140F;color:#FBFAF6;text-decoration:none}\n.dv-tname{font:400 15px/1.2 \"Dessign Maison\",serif;letter-spacing:-.01em;color:#17140F}\n.dv-sub{font:400 11.5px/1.5 Karrik,sans-serif;color:#8A8474;max-width:70ch;margin:0 0 24px}\n.dv-opts{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}\n.dv-grp{flex-basis:100%;margin:18px 0 -16px;font:400 10px Karrik,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8A8474;border-top:1px solid #E0DCCE;padding-top:14px}\n.dv-opt{flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px}\n.dv-oid{font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;backg {transform:translate(0,3px) rotate(2deg)}72%,100%{transform:translate(0,0) rotate(0deg)}}\n@keyframes cb-tD{0%,26%{transform:translate(0,0) rotate(0deg)}44%{transform:translate(-16px,-32px) rotate(40deg)}58%{transform:translate(-3px,-5px) rotate(6deg)}70%{transform:translate(0,2px) rotate(-1deg)}78%,100%{transform:translate(0,0) rotate(0deg)}}\n@keyframes cb-tE{0%,23%{transform:translate(0,0) rotate(0deg)}41%{transform:translate(9px,-50px) rotate(-44deg)}55%{transform:translate(2px,-7px) rotate(-8deg)}67%{transform:translate(0,3px) rotate(2deg)}75%,100%{transform:translate(0,0) rotate(0deg)}}\n@keyframes cb-blurb{0%,3%{opacity:0;transform:translateY(7px)}8%{opacity:1;transform:translateY(0)}20%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-5px)}}\n@keyframes cb-ring{0%{stroke-dashoffset:295}100%{stroke-dashoffset:70}}\n@keyframes cb-spin{to{transform:rotate(360deg)}}\n@keyframes cb-locpulse{0%{transform:scale(.7);opacity:.55}100%{transform:scale(1.7);opacity:0}}\n<\u002Fstyle>\n\n<\u002Fhelmet>\n<section class=\"dv-turn\" id=\"brief\" style=\"padding-top:56px\">\n<div class=\"dv-thd\"><span class=\"dv-tid\" style=\"background:#274D8F\">Brief<\u002Fspan><span class=\"dv-tname\">Chellbook · wireframe exploration<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:44px;flex-wrap:wrap;align-items:flex-start;margin-top:6px\">\n<p class=\"dv-sub\" style=\"max-width:56ch;margin:0;font-size:12.5px;color:#3A362D\">I was asked to design an app that takes any recipe and makes it safe for someone who cannot eat gluten. I decided early that this is a safety product that happens to be about food, so almost every wireframe here is working on one question: how do I tell somebody the truth about what they are about to eat, without frightening them, and without ever sounding more certain than I actually am.<br><br>Four passes, finished work first. Everything above the Earlier divider is current and built on Apple's own conventions. The two passes below it are mine rather than the platform's and have been superseded, and I have kept them visible because the wrong turns are where most of the rules came from.<\u002Fp>\n<div style=\"flex:none;width:280px;display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font:400 11px/1.5 Karrik,sans-serif;color:#3A362D;border-left:1px solid #DCD8CB;padding-left:20px\">\n<b style=\"font-weight:400;color:#8A8474\">Role<\u002Fb><span>Product design, end to end<\u002Fspan>\n<b style=\"font-weight:400;color:#8A8474\">Platform<\u002Fb><span>iPhone, iOS 18 conventions<\u002Fspan>\n<b style=\"font-weight:400;color:#8A8474\">For<\u002Fb><span>Newly diagnosed and long-time gluten-free cooks, many of them not confident with phones<\u002Fspan>\n<b style=\"font-weight:400;color:#8A8474\">Passes<\u002Fb><span>4, newest first<\u002Fspan>\n<b style=\"font-weight:400;color:#8A8474\">Screens<\u002Fb><span>46 wireframes<\u002Fspan>\n<b style=\"font-weight:400;color:#8A8474\">Outcome<\u002Fb><span>30 designed screens in the product design file<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:30px;border-top:1px solid #E0DCCE;padding-top:16px\">\n<div class=\"dv-grp\" style=\"margin:0 0 12px;border:none;padding:0\">Three things I decided before I drew anything, and never changed<\u002Fdiv>\n<div style=\"display:flex;gap:1px;background:#DCD8CB;border:1px solid #DCD8CB;flex-wrap:wrap\">\n<div style=\"flex:1;min-width:230px;background:#FFFEFB;padding:15px 16px;display:flex;flex-direction:column;gap:6px\"><div style=\"font:400 12.5px 'Dessign Maison',serif;letter-spacing:-.01em;color:#17140F\">Four states, never a fifth<\u002Fdiv><div style=\"font:400 11px/1.5 Karrik,sans-serif;color:#5C5648\">Verified, Check the label, Blocking, Unknown. Each one gets a word, a color and a shape, so none of them can be read by color alone or confused with its neighbour.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;min-width:230px;background:#FFFEFB;padding:15px 16px;display:flex;flex-direction:column;gap:6px\"><div style=\"font:400 12.5px 'Dessign Maison',serif;letter-spacing:-.01em;color:#17140F\">One conversion is one whole recipe<\u002Fdiv><div style=\"font:400 11px/1.5 Karrik,sans-serif;color:#5C5648\">Asking a follow-up, fixing a texture or reopening something saved never costs anything. If a cook has to ration questions, they will stop asking the ones that matter.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1;min-width:230px;background:#FFFEFB;padding:15px 16px;display:flex;flex-direction:column;gap:6px\"><div style=\"font:400 12.5px 'Dessign Maison',serif;letter-spacing:-.01em;color:#17140F\">Pro buys control, never safety<\u002Fdiv><div style=\"font:400 11px/1.5 Karrik,sans-serif;color:#5C5648\">Free and Pro run identical checks. I test every Pro string by swapping \"Pro\" for \"safer\": if the sentence still works, the feature is cut.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"dv-turn\" id=\"t4\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t4\" style=\"background:#274D8F\">04<\u002Fa><span class=\"dv-tname\">Pass four · the whole thing, connected<\u002Fspan><span style=\"font:400 10px Karrik,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#274D8F;border:1px solid #C3CEE4;padding:3px 8px\">Final<\u002Fspan><\u002Fdiv>\n<p class=\"dv-sub\">The journey end to end as connected screens, on the five-tab shell. Loading became a bowl tossing a salad on a circular sweep with blurbs fading through, looping seamlessly so a question can interrupt it and it carries on afterwards without a seam. I moved credits into Usage under Profile and framed them as information rather than as a limit, because I did not want a meter following people around their own kitchen. Groceries became location-based, with a permission gate that has a real way out of it.<\u002Fp>\n<div class=\"dv-opts\">\n\n<div class=\"dv-grp\">The connected flow · paste → toss → question → found → recipe → cook<\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"4a\"><div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#4a\">4a<\u002Fa>Home, the Cook tab<\u002Fdiv>\n<div class=\"dv-card ios\"><div class=\"ph3\">\n<div class=\"sb3\"><span>9:41<\u002Fspan><svg width=\"46\" height=\"12\" sc-camel-view-box=\"0 0 46 12\" fill=\"#1C1C1E\"><rect x=\"0\" y=\"7\" width=\"2.4\" height=\"4\" rx=\"1\"><\u002Frect><rect x=\"3.6\" y=\"5.4\" width=\"2.4\" height=\"5.6\" rx=\"1\"><\u002Frect><rect x=\"7.2\" y=\"3.6\" width=\"2.4\" height=\"7.4\" rx=\"1\"><\u002Frect><rect x=\"10.8\" y=\"1.8\" width=\"2.4\" height=\"9.2\" rx=\"1\"><\u002Frect><path d=\"M18 5a7 7 0 0 1 8.8 0l-1.4 1.6a4.8 4.8 0 0 0-6 0Z\"><\u002Fpath><path d=\"M20 7.4a4 4 0 0 1 4.8 0L22.4 10Z\"><\u002Fpath><rect x=\"31\" y=\"2\" width=\"12\" height=\"8\" rx=\"2.4\" fill=\"none\" stroke=\"#1C1C1E\" stroke-opacity=\".4\"><\u002Frect><rect x=\"32.3\" y=\"3.3\" width=\"7.4\" height=\"5.4\" rx=\"1.2\"><\u002Frect><path d=\"M44 4.6v2.8a1.5 1.5 0 0 0 0-2.8Z\" fill-opacity=\".4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div class=\"pad3\">\n<div style=\"font-size:24px;font-weight:700;letter-spacing:-.02em\">Chellbook<\u002Fdiv>\n<div style=\"font-size:15px;color:#3A3A3C\">Paste a recipe, get a gluten-free version that still cooks and tastes like the original<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:16px;padding:14px;color:#8E8E93;font-size:14px;min-height:64px\">Paste a recipe link or its text here<\u002Fdiv>\n<div class=\"ibtn\">Make it gluten-free<\u002Fdiv>\n<div class=\"itint\" style=\"display:flex;align-items:center;justify-content:center;gap:7px\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#007AFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 8h3l1.5-2h7L17 8h3v11H4Z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"3.2\"><\u002Fcircle><\u002Fsvg>Quick scan a label<span style=\"background:#F3EEFC;color:#7A3FBF;border-radius:999px;font-size:10px;padding:2px s&nbsp;&nbsp;<\u002Fb>This is the pass the finished product design grew out of. One thing changed after it: Quick scan was a full-width button on the home screen here, and I demoted it to a chip on the input row. It reads one label, it does not produce a recipe, so sitting next to the primary action taught people the wrong thing about what Chellbook is for. A control should be sized by how central it is to the job, not by how much it costs.<br><br><b style=\"font-weight:400;color:#8A8474\">Still open&nbsp;&nbsp;<\u002Fb>The Trusted brands editor, cross-contamination in a shared kitchen, and what the app should do for a cook who is already halfway through cooking when they find the problem.<\u002Fp>\n<\u002Fsection>\n<section class=\"dv-turn\" id=\"t3\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t3\" style=\"background:#274D8F\">03<\u002Fa><span class=\"dv-tname\">Pass three · making it native, and making it legal<\u002Fspan><span style=\"font:400 10px Karrik,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#274D8F;border:1px solid #C3CEE4;padding:3px 8px\">Current<\u002Fspan><\u002Fdiv>\n<p class=\"dv-sub\">Two things changed my mind at the same time. A lot of the people who need this app are newly diagnosed, older, or simply not confident with phones, and every interface convention I invented was costing them more than it was buying me. So I moved in-app to Apple's system font, colors and status bar, put normal capitalization back, and took the periods off titles.<br><br>The second thing is that I worked out I am not allowed to rate a brand. I can quote what its own label says, say where I read it and when, then hand the decision back. That constraint produced the breakdown screens, the brand rules in <a class=\"dv-oid\" href=\"#3d\">3d<\u002Fa>, and eventually the whole four-state vocabulary.<\u002Fp>\n<div class=\"dv-opts\">\n\n<div class=\"dv-grp\">Home · developed from <a class=\"dv-oid\" href=\"#2a\">2a<\u002Fa><\u002Fdiv>\n<div class=\" ent card, built from those rules<\u002Fdiv>\n<div class=\"ilist\"><div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:6px\">\n<div style=\"font-size:13.5px\"><b>Soy sauce<\u002Fb> <span class=\"igry\">· your recipe says \"Kikkoman soy sauce\"<\u002Fspan><\u002Fdiv>\n<div style=\"font-size:12px\"><span class=\"io\" style=\"font-weight:600\">Check the label.<\u002Fspan> The manufacturer's published ingredient list includes wheat <span class=\"igry\">(manufacturer website, Jul 20, 2026)<\u002Fspan>. Recipes and shelves change, so the package in your hand is the final word.<\u002Fdiv>\n<div style=\"font-size:12px\" class=\"ib\">See the source ›<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"ifoot\">Every brand statement = a quoted source + a date + \"check your package\". Statements describe one product's ingredient list, never the company. \"Unknown\" is presented as our limitation, not their fault. Wording templates are owned and reviewed by legal, the model can't freestyle them.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<div class=\"dv-grp\">Versions · developed from <a class=\"dv-oid\" href=\"#2j\">2j<\u002Fa><\u002Fdiv>\n<div class=\"dv-opt\" id=\"3e\"><div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#3e\">3e<\u002Fa>Long-press to peek, let go to open (animated)<\u002Fdiv>\n<div class=\"dv-card ios\"><div class=\"ph3\">\n<div class=\"sb3\"><span>9:41<\u002Fspan><svg width=\"50\" height=\"12\" sc-camel-view-box=\"0 0 50 12\" fill=\"#1C1C1E\"><rect x=\"0\" y=\"7\" width=\"2.6\" height=\"4\" rx=\"1\"><\u002Frect><rect x=\"4\" y=\"5.4\" width=\"2.6\" height=\"5.6\" rx=\"1\"><\u002Frect><rect x=\"8\" y=\"3.6\" width=\"2.6\" height=\"7.4\" rx=\"1\"><\u002Frect><rect x=\"12\" y=\"1.8\" width=\"2.6\" height=\"9.2\" rx=\"1\"><\u002Frect><path d=\"M20.5 5.4a7.5 7.5 0 0 1 9.4 0l-1.5 1.7a5.2 5.2 0 0 0-6.4 0Z\"><\u002Fpath><path d=\"M22.6 8a4.4 4.4 0 0 1 5.2 0l-2.6 2.9Z\"><\u002Fpath><rect x=\"34\" y=\"2\" width=\"12.4\" height=\"8\" rx=\"2.4\" fil "margin-top:4px\">Home, My recipes, Shopping. Icons always have labels. Nothing hides in hamburger menus or gestures.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#F5F4EE;border-radius:12px;padding:10px\"><b>2 · One blue button per screen<\u002Fb><div class=\"ifoot\" style=\"margin-top:4px\">The next step is always the single filled blue button at the bottom, in thumb reach. Everything else is quieter.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#F5F4EE;border-radius:12px;padding:10px\"><b>3 · Back is always \"‹ Back\"<\u002Fb><div class=\"ifoot\" style=\"margin-top:4px\">Top left, every screen, named after where it goes. No X-only exits, no dead ends.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#F5F4EE;border-radius:12px;padding:10px\"><b>4 · Kitchen words, not tech words<\u002Fb><div class=\"ifoot\" style=\"margin-top:4px\">\"We swapped the flour\", never \"substitution mapping applied\". Reading level ~grade 5.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#F5F4EE;border-radius:12px;padding:10px\"><b>5 · Big and forgiving<\u002Fb><div class=\"ifoot\" style=\"margin-top:4px\">Buttons ≥ 44 pt, respects the phone's text size setting, nothing destructive without an undo.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#F5F4EE;border-radius:12px;padding:10px\"><b>6 · Asks, then waits<\u002Fb><div class=\"ifoot\" style=\"margin-top:4px\">One question at a time, plain answers to tap, \"Not sure\" is always an option and never punished.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ifoot\">Curb-cut effect: built for the least tech-comfortable person we can imagine, which makes it faster for everyone else too.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\" style=\"color:#3A362D;border-top:1px solid #E0DCCE;padding-top:16px;max-width:78ch\"><b style=\"font-weight:400;color:#8A8474\">What came out of this pass&nbsp;&nbsp;<\u002Fb>The four state pills stopped being a visual system and became a legal one. Every state carries a word, a color and a shape, Unknown keeps its dashed edge so missing information can never be mistaken for a pass, and no screen anywhere calls a brand safe or unsafe in our own voice. The curb-cut rules in <a class=\"dv-oid\" href=\"#3f\">3f<\u002Fa> are what I checked every later screen against.<\u002Fp>\n<\u002Fsection>\n<section class=\"dv-turn\" id=\"earlier\" style=\"padding-top:34px;padding-bottom:24px;background:#EFECE3\">\n<div class=\"dv-thd\" style=\"margin-bottom:6px\"><span class=\"dv-tid\" style=\"background:#8A8474\">Earlier<\u002Fspan><span class=\"dv-tname\">Before the iOS rebuild<\u002Fspan><\u002Fdiv>\n<p class=\"dv-sub\" style=\"margin:0;max-width:76ch\">The two passes below came before I moved the app onto Apple's own conventions, so their buttons, pills and type are mine rather than the platform's. They are superseded. I kept them because the decisions in <a class=\"dv-oid\" href=\"#2d\">2d<\u002Fa> and <a class=\"dv-oid\" href=\"#2j\">2j<\u002Fa> survived into the finished product, and because pass two is where I got the type wrong in a way that was worth getting wrong.<\u002Fp>\n<\u002Fsection>\n<section class=\"dv-turn\" id=\"t2\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t2\" style=\"background:#B4AFA0\">02<\u002Fa><span class=\"dv-tname\" style=\"color:#5C5648\">Pass two · giving it a voice<\u002Fspan><span style=\"font:400 10px Karrik,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8A8474;border:1px solid #DCD8CB;padding:3px 8px\">Superseded<\u002Fspan><\u002Fdiv>\n<p class=\"dv-sub\">I took every flow from pass one and asked what it would actually feel like in the hand. Gray boxes became color, drawn checkmarks and dashed pills. Primary actions moved into the thumb zone. Sheets and buttons started behaving like a phone rather than a diagram. The motion came out of my motion studies: a soft sheet rise, a check that strokes on, a slow pulse while loading, a smooth roll between versions.<br><br>I also lowercased everything in this pass. It looked good and it was a mistake, which is what pass three, above, is largely about.<\u002Fp>\n<div class=\"dv-opts\">\n\n<div class=\"dv-grp\">Home · developed from <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa><\u002Fdiv>\n<div class=\"dv-opt\" id=\"2a\"><div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#2a\">2a<\u002Fa>Paste docked in the thumb zone<\u002Fdiv>\n<div class=\"dv-card wf\"><div class=\"ph2\"><div class=\"pad2\">\n<div class=\"row\" style=\"justify-content:space-between\"><span class=\"h\" style=\"font-size:18px\">Chellbook<\u002Fspan><span class=\"pill dsh\" style=\"border-color:#B7B2A2;color:#6E6858\">2 of 3 conversions left<\u002Fspan><\u002Fdiv>\n<div class=\"h\" style=\"font-size:22px;line-height:1.12;margin-top:10px\">What are we making gluten-free today?<\u002Fdiv>\n<div class=\"lc\">Same safety checks in Free and Pro, always<\u002Fdiv>\n<div class=\"lc\" style=\"margin-top:8px\">Recent<\u002Fdiv>\n<div class=\"card2\"><div class=\"row\" style=\"justify-content:space-between\"><b>🍌 Banana bread<\u002Fb><span class=\"row gtx\" style=\"gap:4px;font-size:10.5px\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7355\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 13l5 5L20 7\"><\u002Fpath><\u002Fsvg>Verified<\u002Fspan><\u002Fdiv><div class=\"lc\">smittenkitchen.com · 3 swaps · v2<\u002Fdiv><\u002Fdiv>\n<div class=\"card2\"><div class=\"row\" style=\"justify-content:space-between\"><b>🥡 Weeknight stir-fry<\u002Fb><span class=\"atx\" style=\"font-size:10.5px\">Check one label<\u002Fspan><\u002Fdiv><div class=\"lc\">Pasted text · v1<\u002Fdiv><\u002Fdiv>\n<div class=\"card2\"><div class=\"row\" style=\"justify-content:space-between\"><b>🍝 Sunday gravy<\u002Fb><span class=\"utx\" style=\"font-size:10.5px;border-bottom:1px dashed #6E6858\">1 question waiting<\u002Fspan><\u002Fdiv><div class=\"lc\">Tap to answer, it finishes the conversion<\u002Fdiv><\ ackground:#EFEDE3\">Explain this swap<\u002Fspan><span class=\"pill\" style=\"background:#EFEDE3\">Adjust texture<\u002Fspan><span class=\"pill\" style=\"background:#EFEDE3\">Adapt my pan<\u002Fspan><span class=\"pill\" style=\"background:#EFEDE3\">Diagnose a result<\u002Fspan><\u002Fdiv>\n<div class=\"card2\" style=\"border-radius:14px;align-self:flex-end;background:#EFEDE3;border-color:#E3E0D4\"><i style=\"font-size:11px\">\"Mine came out crumbly last time\"<\u002Fi><\u002Fdiv>\n<div style=\"font-size:11.5px\">Crumbly usually means the binder ran short. Two small changes should fix it, want to see them?<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"sheet\" style=\"position:absolute;left:0;right:0;bottom:0;padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;animation:cb-rise 7s cubic-bezier(.2,0,0,1) infinite\"><div class=\"grab\"><\u002Fdiv>\n<div class=\"lc\">Proposed change · nothing applied yet<\u002Fdiv>\n<div class=\"row\" style=\"justify-content:space-between;font-size:11.5px\"><span>Xanthan gum<\u002Fspan><span><span class=\"lc\">1 tsp →<\u002Fspan> <b>1½ tsp<\u002Fb><\u002Fspan><\u002Fdiv>\n<div class=\"row\" style=\"justify-content:space-between;font-size:11.5px\"><span>Dough rest<\u002Fspan><span><span class=\"lc\">30 →<\u002Fspan> <b>45 min<\u002Fb><\u002Fspan><\u002Fdiv>\n<div class=\"row gtx\" style=\"gap:4px;font-size:10.5px\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7355\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 13l5 5L20 7\"><\u002Fpath><\u002Fsvg>Safety state unchanged<\u002Fdiv>\n<div class=\"btn2\">Apply as v4<\u002Fdiv>\n<div class=\"lc\" style=\"text-align:center\">Keep v3 instead<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<div class=\"dv-grp\">Shopping · developed from <a class=\"dv-oid\" href=\"#1l\">1l<\u002Fa><\u002Fdiv>\n<div class=\"dv-opt\" id=\"2l\"><div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#2l\">2l<\u002Fa>Label ch n<\u002Fdiv>\n<p class=\"dv-next\" style=\"color:#3A362D;border-top:1px solid #E0DCCE;padding-top:16px;max-width:78ch\"><b style=\"font-weight:400;color:#8A8474\">What came out of this pass&nbsp;&nbsp;<\u002Fb>The tappable ingredient row in <a class=\"dv-oid\" href=\"#2d\">2d<\u002Fa> became the backbone of the whole app. If a cook can question any single line of a recipe, the recipe stops being something handed down to them. The version timeline in <a class=\"dv-oid\" href=\"#2j\">2j<\u002Fa> convinced me versions were load-bearing rather than a nice extra, since gluten-free baking takes three goes and the app had better make trying cheap. The lowercase experiment did not survive the next pass.<\u002Fp>\n<\u002Fsection>\n<section class=\"dv-turn\" id=\"t1\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t1\" style=\"background:#B4AFA0\">01<\u002Fa><span class=\"dv-tname\" style=\"color:#5C5648\">Pass one · going wide on structure<\u002Fspan><span style=\"font:400 10px Karrik,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8A8474;border:1px solid #DCD8CB;padding:3px 8px\">Superseded<\u002Fspan><\u002Fdiv>\n<p class=\"dv-sub\">Eight areas, two directions each, plus a study of the safety states on their own. I kept these deliberately plain because I wanted to find out which parts of this app are genuinely hard before anything started looking finished. The red notes are questions I could not answer yet.<\u002Fp>\n<div class=\"dv-opts\">\n\n<div class=\"dv-grp\">Home · paste entry<\u002Fdiv>\n<div class=\"dv-opt\" id=\"1a\"><div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>Paste-first hero<\u002Fdiv>\n<div class=\"dv-card wf\"><div class=\"ph\"><div class=\"pad\">\n<div class=\"row\" style=\"justify-content:space-between\"><span class=\"h\" style=\"font-size:17px\">Chellbook<\u002Fspan><span class=\"chip su\" style=\"border-style:solid\">2 of 3 left<\u002Fspan><\u002Fdiv>\n<div style=\"margin-top:18px\"><div class=\"h\" style=\"fo u002Fa>Shopping with attached label checks<\u002Fdiv>\n<div class=\"dv-card wf\"><div class=\"ph\"><div class=\"pad\">\n<div class=\"h\" style=\"font-size:17px\">Shopping<\u002Fdiv>\n<div class=\"note\">From: Chocolate chip cookies · serves 24<\u002Fdiv>\n<div class=\"cap\">Baking aisle<\u002Fdiv>\n<div class=\"row\"><span>☐<\u002Fspan><div style=\"flex:1\">GF flour blend, 240 g<\u002Fdiv><\u002Fdiv>\n<div class=\"row\"><span>☐<\u002Fspan><div style=\"flex:1\">Xanthan gum, 1 tsp<\u002Fdiv><\u002Fdiv>\n<div class=\"row\" style=\"align-items:flex-start\"><span>☐<\u002Fspan><div style=\"flex:1\">Rolled oats, ½ cup<div class=\"chip sc\" style=\"margin-top:4px\">◧ At the shelf: look for \"certified gluten-free\"<\u002Fdiv><div class=\"note\">Plain oats are often milled with wheat.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"cap\" style=\"margin-top:6px\">Dairy<\u002Fdiv>\n<div class=\"row\"><span>☑<\u002Fspan><div style=\"flex:1;text-decoration:line-through;color:#8A8474\">Butter, 170 g<\u002Fdiv><\u002Fdiv>\n<div class=\"bx\" style=\"padding:8px\"><div class=\"row\"><span class=\"dt\" style=\"background:#274D8F\"><\u002Fspan><div class=\"note\"><b>Trusted brand:<\u002Fb> Bob's Red Mill oats, Your saved preference.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<div class=\"ann\">Label guidance travels with the item, it doesn't die when you leave the recipe.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<div class=\"dv-grp\">Free / Pro boundary<\u002Fdiv>\n<div class=\"dv-opt\" id=\"1m\"><div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1m\">1m<\u002Fa>Credits exhausted, honest state<\u002Fdiv>\n<div class=\"dv-card wf\"><div class=\"ph\"><div class=\"pad\">\n<div class=\"row\" style=\"justify-content:space-between\"><span class=\"h\" style=\"font-size:17px\">Chellbook<\u002Fspan><span class=\"chip su\" style=\"border-style:solid\">0 of 3 left<\u002Fspan><\u002Fdiv>\n<div class=\"bx\" style=\"padding:10px\"><b>You've used this month's 3 conversions.<\u002Fb><div class=\"note\">Renews Aug 1. One credit = one whole verified conversion, questions, retries and fixes never cost extra.<\u002Fdiv><\u002Fdiv>\n<div class=\"cap\">Still yours, always<\u002Fdiv>\n<div>✓ Open and cook every saved recipe<\u002Fdiv>\n<div>✓ All safety notes and evidence<\u002Fdiv>\n<div>✓ Scale servings, change units, adjust pans<\u002Fdiv>\n<div>✓ Finish the question on your stir-fry<\u002Fdiv>\n<div class=\"hr\"><\u002Fdiv>\n<div class=\"ghost\" style=\"border-style:dashed;color:#8A8474\">New conversion · available Aug 1<\u002Fdiv>\n<div class=\"btn\">See Pro: more control, more conversions<\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<div class=\"ann\">Never \"Pro is safer\". Disabled action explains itself, no dead ends.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"1n\"><div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1n\">1n<\u002Fa>Pro sheet: control, not safety<\u002Fdiv>\n<div class=\"dv-card wf\"><div class=\"ph\"><div class=\"pad\">\n<div class=\"bx\" style=\"padding:10px;text-align:center\"><span class=\"cap\">Free and Pro run the same safety checks<\u002Fspan><\u002Fdiv>\n<div class=\"h\" style=\"font-size:19px;line-height:1.15\">Pro is more control around the verified result.<\u002Fdiv>\n<div class=\"row\"><span>◆<\u002Fspan><div><b>Texture &amp; baking controls<\u002Fb><div class=\"note\">Chewier, cakier, crispier, tuned from your verified base<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"row\"><span>◆<\u002Fspan><div><b>Your flour blend &amp; hydration<\u002Fb><div class=\"note\">Manual blend math, done for you<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"row\"><span>◆<\u002Fspan><div><b>Pan &amp; equipment adaptation<\u002Fb><div class=\"note\">9-inch round → two 6-inch, recalculated<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"row\"><span>◆<\u002Fspan><div><b>Conversational editing<\u002Fb><div class=\"note\">Saved branches and versions<\u002Fdiv><\u0 host\" style=\"flex:1;padding:7px\">Keep rev 3<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"1p\"><div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1p\">1p<\u002Fa>Live values: numbers stay connected<\u002Fdiv>\n<div class=\"dv-card wf\"><div class=\"ph\"><div class=\"pad\">\n<div class=\"cap\">Cookies · scaling<\u002Fdiv>\n<div class=\"row\"><div style=\"flex:1\"><b>Servings<\u002Fb><\u002Fdiv><div class=\"row\"><span class=\"ghost\" style=\"padding:4px 12px\">−<\u002Fspan><b>36<\u002Fb><span class=\"ghost\" style=\"padding:4px 12px\">+<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"note\">Was 24. Everything below just updated together:<\u002Fdiv>\n<div class=\"row\"><div style=\"flex:1\">GF flour blend<\u002Fdiv><b>360 g<\u002Fb><span class=\"cap\">auto<\u002Fspan><\u002Fdiv>\n<div class=\"row\"><div style=\"flex:1\">Eggs<\u002Fdiv><b>3<\u002Fb><span class=\"cap\">rounded<\u002Fspan><\u002Fdiv>\n<div class=\"note\" style=\"margin:-6px 0 0 2px\">2¼ eggs isn't practical, dough will be slightly firmer.<\u002Fdiv>\n<div class=\"row\"><div style=\"flex:1\">Trays needed<\u002Fdiv><b>2<\u002Fb><span class=\"cap\">your oven<\u002Fspan><\u002Fdiv>\n<div class=\"row\"><div style=\"flex:1\">Bake time<\u002Fdiv><b>10–14 min<\u002Fb><span class=\"cap\">rule<\u002Fspan><\u002Fdiv>\n<div class=\"note\" style=\"margin:-6px 0 0 2px\">Per-tray time doesn't scale with batch size, same test applies.<\u002Fdiv>\n<div class=\"hr\"><\u002Fdiv>\n<div class=\"row\"><span class=\"chip sv\">No new AI credit used<\u002Fspan><\u002Fdiv>\n<div class=\"note\">Changing the flour blend itself would trigger a visible replan, and would tell you first.<\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<div class=\"ann\">Deterministic / rounded / rule-based values each explain themselves inline.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\" style=\"color:#3A362D;border-top:1px solid #E0DCCE;padding-top:16px;max-width:78ch\"><b style=\"font-weight:400;color:#8A8474\">What came out of this pass&nbsp;&nbsp;<\u002Fb>Paste-first beat library-first (<a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa> over <a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa>). Nobody opens this app to browse, they open it holding a recipe they already want. I also dropped the idea of a general assistant: every question the app asks has to be attached to the thing it is about, which is why the AI work in <a class=\"dv-oid\" href=\"#1o\">1o<\u002Fa> is a sheet on an ingredient rather than a text box. The question I could not settle here was what happens when an ingredient simply cannot stay, and that turned into the hardest flow in the product.<\u002Fp>\n<\u002Fsection>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
