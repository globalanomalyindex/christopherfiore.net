document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  const REACT_IFRAME_PROBE = 'try{var c="string"===typeof b.contentWindow.location.href}catch(d){c=!1}if(c)a=b.contentWindow;else break;';
  const REACT_IFRAME_PROBE_SAFE = 'try{var c=b.contentWindow;c=!!c&&"string"===typeof c.location.href}catch(d){c=!1}if(c)a=c;else break;';
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var message = String(e.message || e.type || '');
    if (/contentWindow\.(document|location)/.test(message) &&
        /(null is not an object|Cannot read properties of null)/.test(message)) {
      e.preventDefault();
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + message +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags , manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        // ReactDOM 18 reads iframe.contentWindow twice while restoring focus.
        // Mobile Safari can detach the frame between those reads. Keep the
        // first reference and use it for the rest of the probe.
        if (/javascript/i.test(entry.mime)) {
          let source = new TextDecoder().decode(finalBytes);
          if (source.includes(REACT_IFRAME_PROBE)) {
            source = source.replace(REACT_IFRAME_PROBE, REACT_IFRAME_PROBE_SAFE);
            finalBytes = new TextEncoder().encode(source);
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs ,
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin , blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec , re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

4-617c-4c95-812f-259a54068b3d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"0a103037-12a3-441c-bdac-6d7cef014195\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"9953668c-2cc8-4be4-87c5-cc13cd3ff1d8\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"97b42ec4-617c-4c95-812f-259a54068b3d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"0a103037-12a3-441c-bdac-6d7cef014195\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9953668c-2cc8-4be4-87c5-cc13cd3ff1d8\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"97b42ec4-617c-4c95-812f-259a54068b3d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Custom \"design house\" display face , geometric, wide, high-gloss.\n   One weight only (Regular). Use LARGE, uppercase for the wordmark,\n   mixed-case for editorial headlines. Never for body copy. */\n@font-face {\n  font-family: \"Maison Display\";\n  src: url(\"eb1924df-7aa6-4a9d-92c9-6966b9615976\") format(\"opentype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* Karrik , replaces the old mono. Labels, indices, captions.\n   One weight (Regular); lowercase, modest tracking , never HUD-style caps. */\n@font-face {\n  font-family: \"Karrik\";\n  src: url(\"817927cb-7073-445c-bb0e-68d1246ad082\") format(\"opentype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   COLOR , \"Plumage\"\n   Solid pops sampled from a grey cockatiel (crest yellow, cheek\n   orange, beak blush) connected by two warm-neutral families\n   (earth = tan/cream paper, ash = the bird's dove-grey body).\n   Rendered Marathon-style: flat fields, hard ink edges, modular\n   colour blocks.\n   ============================================================ */\n\n:root {\n  /* ---------- POP · CREST (canary yellow , primary) ---------- */\n  --crest-50:  #FCF3CF;\n  --crest-100: #F8E59D;\n  --crest-200: #F2D264;\n  --crest-300: #EAC231;   /* BASE */\n  --crest-400: #D2A81F;\n  --crest-500: #A57E13;   /* press / shade */\n  --crest-600: #6E5309;   /* text-on-light */\n\n  /* ---------- POP · CHEEK (burnt-coral orange , secondary) ---------- */\n  --cheek-50:  #F6DBCB;\n  --cheek-100: #EAB08E;\n  --cheek-200: #DB8256;\n  --cheek-300: #C9572E;   /* BASE */\n  --cheek-400: #AC4522;\n  --cheek-500: #823117;   /* press / shade */\n  --cheek-600: #571F0E;\n\n  /* ---------- POP · BLUSH (beak pink , soft tertiary) ---------- */\n  --blush-50:  #F7E8E2;\n  --blush-100: #EDD0C7;\n  --blush-200: #E4B6AA;\n  --blush-300: #DD9C8D;   /* BASE */\n  --blush-400: #C67F6E;\n  --blush-500: #A2604F;\n\n  /* ---------- POP · SKY (bright azure , cool primary pop) ---------- */\n  --sky-50:  #DCEBFA;\n  --sky-100: #A9CFF4;\n  --sky-200: #6BADEE;\n  --sky-300: #2E8BE8;   /* BASE */\n  --sky-400: #1D6FC2;\n  --sky-500: #124E8C;   /* press / shade */\n  --sky-600: #0B3159;   /* text-on-light */\n\n  /* ---------- POP · PUNCH (hot magenta , loud accent) ---------- */\n  --punch-50:  #FADCE9;\n  --punch-100: #F3A9C9;\n  --punch-200: #EC6BA4;\n  --punch-300: #E2247E;   /* BASE */\n  --punch-400: #BC1465;\n  --punch-500: #8C0E4B;   /* press / shade */\n\n  /* ---------- POP · LEAF (parrot green , fresh counterweight) ---------- */\n  --leaf-50:  #DFF0DC;\n  --leaf-100: #B4DFAE;\n  --leaf-200: #7FC677;\n  --leaf-300: #46A94A;   /* BASE */\n  --leaf-400: #348438;\n  --leaf-500: #235C27;   /* press / shade */\n\n  /* ---------- NEUTRAL · EARTH (warm tan / cream , paper & warm fields) ---------- */\n  --earth-0:   #FCFAF3;   /* paper white (card surface) */\n  --earth-50:  #F6F1E6;   /* bone , default page */\n  --earth-100: #EFE6D2;   /* cream */\n  --earth-200: #E4D5B7;\n  --earth-300: #D6C29B;   /* sand */\n  --earth-400: #C3AB7D;   /* tan */\n  --earth-500: #A98F5F;   /* khaki */\n\n  /* ---------- NEUTRAL · ASH (warm dove-grey , text, borders, ink fields) ---------- */\n  --ash-50:  #ECEAE3;\n  --ash-100: #D8D4C9;\n  --ash-200: #BDB8AA;\n  --ash-300: #9E9888;\n  --ash-400: #8B8576;   /* slate , the bird's body */\n  --ash-500: #6C665A;\n  --ash-600: #4E4940;\n  --ash-700: #35322B;   /* graphite */\n  --ash-800: #23211C;   /* ink */\n  --ash-900: #161511;   /* char (deepest) */\n\n  /* ---------- STATUS (kept earthy so everything connects) ---------- */\n  --ok:       #6E7A2F;   --ok-deep:    #545E22;   --ok-tint:    #E7EAD0;\n  --warn:     #EAC231;   --warn-deep:  #A57E13;   --warn-tint:  #FBF0C6;\n  --alert:    #B23320;   --alert-deep: #8A2616;   --alert-tint: #F4D8CF;\n  --info:     #5E7377;   --info-deep:  #47585B;   --info-tint:  #DCE5E4;\n\n  /* ============================================================\n     SEMANTIC ALIASES , reference THESE in components\n     ============================================================ */\n  --bg:            var(--earth-50);\n  --bg-sunk:       var(--earth-100);\n  --surface:       var(--earth-0);\n  --surface-2:     var(--earth-100);\n  --surface-inset: var(--earth-200);\n  --surface-invert:var(--ash-800);      /* dark Marathon panels */\n  --surface-invert-2:var(--ash-700);\n\n  --text:          var(--ash-800);\n  --text-muted:    var(--ash-500);\n  --text-faint:    var(--ash-300);\n  --text-invert:   var(--earth-50);\n  --text-invert-muted: var(--ash-200);\n  --text-on-pop:   var(--ash-900);      /* dark text on yellow/blush */\n\n  --ink:           var(--ash-800);      /* hard graphic borders + shadows */\n  --paper:         var(--earth-0);\n\n  --border:        #DED3BF;             /* soft earthy divider */\n  --border-strong: var(--ash-800);      /* hard Marathon outline */\n  --hairline:      rgba(35, 33, 28, 0.10);\n\n  --accent:        var(--crest-300);\n  --accent-press:  var(--crest-500);\n  --accent-2:      var(--cheek-300);\n  --accent-2-press:var(--cheek-500);\n  --accent-3:      var(--blush-300);\n  --accent-4:      var(--sky-300);\n  --accent-5:      var(--punch-300);\n  --accent-6:      var(--leaf-300);\n\n  --focus:         var(--cheek-300);\n  --link:          var(--cheek-400);\n\n  /* Rare decorative iridescence (the prism-through-the-window shot).\n     Use once per view, at most , never as a primary surface. */\n  --gradient-prism: linear-gradient(105deg,#F2D264 0%,#DD9C8D 28%,#9BB3C7 52%,#8FBFA8 74%,#EAC231 100%); /* @kind color */\n  /* deprecated , hazard stripes retired with the flat graphic pivot; kept so legacy markup doesn't break */\n  --stripe-hazard: repeating-linear-gradient(-45deg, var(--ink) 0 10px, transparent 10px 20px); /* @kind color */\n  --stripe-hazard-crest: repeating-linear-gradient(-45deg, var(--crest-300) 0 12px, var(--ink) 12px 24px); /* @kind color */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   TYPOGRAPHY , families, scale, weights, leading, tracking\n   ============================================================ */\n\n:root {\n  /* ---------- families ---------- */\n  --font-display: \"Maison Display\", \"Space Grotesk\", ui-sans-serif, sans-serif;\n  --font-sans:    \"Space Grotesk\", ui-sans-serif, system-ui, -apple-system, sans-serif;\n  --font-label:   \"Karrik\", \"Space Grotesk\", ui-sans-serif, sans-serif;\n  /* deprecated alias , Space Mono is gone; old --font-mono refs resolve to Karrik */\n  --font-mono:    var(--font-label);\n\n  /* ---------- size scale (px) ---------- */\n  --text-2xs:  11px;\n  --text-xs:   12px;\n  --text-sm:   14px;\n  --text-base: 16px;\n  --text-md:   18px;\n  --text-lg:   21px;\n  --text-xl:   26px;\n  --text-2xl:  33px;\n  --text-3xl:  44px;\n  --text-4xl:  60px;\n  --text-5xl:  82px;\n  --text-6xl:  112px;\n  --text-7xl:  152px;\n\n  /* fluid display sizes for hero type */\n  --display-hero: clamp(56px, 11vw, 152px); /* @kind font */\n  --display-lg:   clamp(40px, 7vw, 92px);   /* @kind font */\n  --display-md:   clamp(30px, 4.5vw, 56px); /* @kind font */\n\n  /* ---------- weights (Space Grotesk 300-700; Maison is 400 only) ---------- */\n  --weight-light:   300;\n  --weight-regular: 400;\n  --weight-medium:  500;\n  --weight-semibold:600;\n  --weight-bold:    700;\n\n  /* ---------- line-height ---------- */\n  --leading-none:    1;\n  --leading-tight:   1.06;\n  --leading-snug:    1.18;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* ---------- letter-spacing ---------- */\n  --track-display: -0.04em;  /* Maison display type , always */\n  --track-tighter: -0.03em;\n  --track-tight:   -0.015em;\n  --track-normal:  0; /* @kind font */\n  --track-wide:    0.04em;\n  --track-wider:   0.12em;   /* deprecated , wide-tracked labels retired */\n  --track-widest:  0.22em;   /* deprecated , HUD caps retired */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   SPACING & LAYOUT , 4px base grid\n   ============================================================ */\n\n:root {\n  --space-px: 1px;\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n  --space-40: 160px;\n  --space-48: 192px;\n\n  /* layout */\n  --gutter:          24px;\n  --page-pad:        clamp(20px, 5vw, 72px);\n  --container:       1240px;\n  --container-wide:  1480px;\n  --container-narrow:820px;\n\n  /* control heights (44px min touch target on primary controls) */\n  --control-sm: 34px;\n  --control-md: 44px;\n  --control-lg: 54px;\n\n  /* hairline / outline widths */\n  --line-hair:   1px;\n  --line-medium: 1.5px;\n  --line-bold:   2px;\n  --line-heavy:  3px;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   RADII , none. The system is squared-off: modules, panels,\n   cards and controls all sit on hard 90° corners (modular\n   graphic look). Depth and softness come from colour alone ,\n   the system is flat; nothing is lifted.\n   The only circles allowed are functional indicator dots\n   (radio, LED status dots) , use --radius-round for those,\n   never for containers.\n   ============================================================ */\n\n:root {\n  --radius-none: 0;\n\n  /* semantic , all squared */\n  --radius-module:  0;   /* buttons / chips / colour modules */\n  --radius-control: 0;   /* inputs / selects / textareas */\n  --radius-card:    0;   /* cards / project tiles */\n  --radius-panel:   0;   /* structural panels / sections */\n\n  /* the single exception: round indicator dots (radio, LEDs) */\n  --radius-round: 999px;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   SHADOWS , none. The system is FLAT: solid colour fields\n   meeting each other directly. Separation comes from colour\n   contrast and heavy ink rules, never from elevation, gloss,\n   or offsets. The old hard-offset \"sticker\" shadows are\n   DEPRECATED and resolve to none so legacy markup degrades\n   gracefully , do not use them in new work.\n   ============================================================ */\n\n:root {\n  --shadow-hard-sm: none;    /* deprecated */\n  --shadow-hard:    none;    /* deprecated */\n  --shadow-hard-lg: none;    /* deprecated */\n  --shadow-hard-crest: none; /* deprecated */\n  --shadow-hard-cheek: none; /* deprecated */\n\n  /* ---------- focus ring (kept , accessibility, not decoration) ---------- */\n  --ring-focus: 0 0 0 3px rgba(201,87,46,0.42);\n  --ring-focus-inset: inset 0 0 0 2px var(--cheek-300);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   MOTION , snappy & mechanical, with an occasional plastic bounce\n   ============================================================ */\n\n:root {\n  --dur-instant: 80ms;  /* @kind other */\n  --dur-fast:    140ms; /* @kind other */\n  --dur:         220ms; /* @kind other */\n  --dur-slow:    360ms; /* @kind other */\n  --dur-slower:  560ms; /* @kind other */\n\n  --ease-standard:  cubic-bezier(0.4, 0, 0.2, 1);      /* @kind other */\n  --ease-out:       cubic-bezier(0.16, 1, 0.3, 1);     /* @kind other */\n  --ease-in:        cubic-bezier(0.4, 0, 1, 1);        /* @kind other */\n  --ease-snap:      cubic-bezier(0.2, 0.9, 0.25, 1);   /* @kind other */\n  --ease-overshoot: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n\n  /* stock transitions */\n  --t-color:  color var(--dur-fast) var(--ease-standard), background-color var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard); /* @kind other */\n  --t-transform: transform var(--dur) var(--ease-snap); /* @kind other */\n  --t-all:    all var(--dur) var(--ease-snap); /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   BASE , light, non-invasive element defaults + a11y.\n   Consumers linking styles.css inherit these. No utility soup;\n   decoration is oversized display type + solid colour blocks.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  font-weight: var(--weight-regular);\n  color: var(--text);\n  background-color: var(--bg);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6, p, figure { margin: 0; }\n\na { color: var(--link); text-decoration: none; }\na:hover { text-decoration: underline; text-underline-offset: 0.15em; }\n\nimg, svg, video, canvas { display: block; max-width: 100%; }\n\nbutton, input, select, textarea { font: inherit; color: inherit; }\n\n::selection { background: var(--crest-300); color: var(--ash-900); }\n\n:focus-visible {\n  outline: none;\n  box-shadow: var(--ring-focus);\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.01ms !important;\n    scroll-behavior: auto !important;\n  }\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Chris Robin Fiore , Design System\n   Global entry point. Consumers link THIS one file.\n   Import order matters: fonts → tokens → base (base uses tokens).\n   ============================================================ */\n\n/* ============================================================\n   FONTS , the type binaries shipped to consumers\n   Display : Maison Display (custom, single Regular weight)\n   Sans    : Space Grotesk (geometric grotesque workhorse)\n   Label   : Karrik (libre grotesque , labels, indices, captions)\n   ============================================================ */\n\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"0a103037-12a3-441c-bdac-6d7cef014195\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"9953668c-2cc8-4be4-87c5-cc13cd3ff1d8\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"97b42ec4-617c-4c95-812f-259a54068b3d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+ -0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9953668c-2cc8-4be4-87c5-cc13cd3ff1d8\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"97b42ec4-617c-4c95-812f-259a54068b3d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Custom \"design house\" display face , geometric, wide, high-gloss.\n   One weight only (Regular). Use LARGE, uppercase for the wordmark,\n   mixed-case for editorial headlines. Never for body copy. */\n@font-face {\n  font-family: \"Maison Display\";\n  src: url(\"eb1924df-7aa6-4a9d-92c9-6966b9615976\") format(\"opentype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* Karrik , replaces the old mono. Labels, indices, captions.\n   One weight (Regular); lowercase, modest tracking , never HUD-style caps. */\n@font-face {\n  font-family: \"Karrik\";\n  src: url(\"817927cb-7073-445c-bb0e-68d1246ad082\") format(\"opentype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* ============================================================\n   COLOR , \"Plumage\"\n   Solid pops sampled from a grey cockatiel (crest yellow, cheek\n   orange, beak blush) connected by two warm-neutral families\n   (earth = tan/cream paper, ash = the bird's dove-grey body).\n   Rendered Marathon-style: flat fields, hard ink edges, modular\n   colour blocks.\n   ============================================================ */\n\n:root {\n  /* ---------- POP · CREST (canary yellow , primary) ---------- */\n  --crest-50:  #FCF3CF;\n  --crest-100: #F8E59D;\n  --crest-200: #F2D264;\n  --crest-300: #EAC231;   /* BASE */\n  --crest-400: #D2A81F;\n  --crest-500: #A57E13;   /* press / shade */\n  --crest-600: #6E5309;   /* text-on-light */\n\n  /* ---------- POP · CHEEK (burnt-coral orange , secondary) ---------- */\n  --cheek-50:  #F6DBCB;\n  --cheek-100: #EAB08E;\n  --cheek-200: #DB8256;\n  --cheek-300: #C9572E;   /* BASE */\n  --cheek-400: #AC4522;\n  --cheek-500: #823117;   /* press / shade */\n  --cheek-600: #571F0E;\n\n  /* ---------- POP · BLUSH (beak pink , soft tertiary) ---------- */\n  --blush-50:  #F7E8E2;\n  --blush-100: #EDD0C7;\n  --blush-200: #E4B6AA;\n  --blush-300: #DD9C8D;   /* BASE */\n  --blush-400: #C67F6E;\n  --blush-500: #A2604F;\n\n  /* ---------- POP · SKY (bright azure , cool primary pop) ---------- */\n  --sky-50:  #DCEBFA;\n  --sky-100: #A9CFF4;\n  --sky-200: #6BADEE;\n  --sky-300: #2E8BE8;   /* BASE */\n  --sky-400: #1D6FC2;\n  --sky-500: #124E8C;   /* press / shade */\n  --sky-600: #0B3159;   /* text-on-light */\n\n  /* ---------- POP · PUNCH (hot magenta , loud accent) ---------- */\n  --punch-50:  #FADCE9;\n  --punch-100: #F3A9C9;\n  --punch-200: #EC6BA4;\n  --punch-300: #E2247E;   /* BASE */\n  --punch-400: #BC1465;\n  --punch-500: #8C0E4B;   /* press / shade */\n\n  /* ---------- POP · LEAF (parrot green , fresh counterweight) ---------- */\n  --leaf-50:  #DFF0DC;\n  --leaf-100: #B4DFAE;\n  --leaf-200: #7FC677;\n  --leaf-300: #46A94A;   /* BASE */\n  --leaf-400: #348438;\n  --leaf-500: #235C27;   /* press / shade */\n\n  /* ---------- NEUTRAL · EARTH (warm tan / cream , paper & warm fields) ---------- */\n  --earth-0:   #FCFAF3;   /* paper white (card surface) */\n  --earth-50:  #F6F1E6;   /* bone , default page */\n  --earth-100: #EFE6D2;   /* cream */\n  --earth-200: #E4D5B7;\n  --earth-300: #D6C29B;   /* sand */\n  --earth-400: #C3AB7D;   /* tan */\n  --earth-500: #A98F5F;   /* khaki */\n\n  /* ---------- NEUTRAL · ASH (warm dove-grey , text, borders, ink fields) ---------- */\n  --ash-50:  #ECEAE3;\n  --ash-100: #D8D4C9;\n  --ash-200: #BDB8AA;\n  --ash-300: #9E9888;\n  --ash-400: #8B8576;   /* slate , the bird's body */\n  --ash-500: #6C665A;\n  --ash-600: #4E4940;\n  --ash-700: #35322B;   /* graphite */\n  --ash-800: #23211C;   /* ink */\n  --ash-900: #161511;   /* char (deepest) */\n\n  /* ---------- STATUS (kept earthy so everything connects) ---------- */\n  --ok:       #6E7A2F;   --ok-deep:    #545E22;   --ok-tint:    #E7EAD0;\n  --warn:     #EAC231;   --warn-deep:  #A57E13;   --warn-tint:  #FBF0C6;\n  --alert:    #B23320;   --alert-deep: #8A2616;   --alert-tint: #F4D8CF;\n  --info:     #5E7377;   --info-deep:  #47585B;   --info-tint:  #DCE5E4;\n\n  /* ============================================================\n     SEMANTIC ALIASES , reference THESE in components\n     ============================================================ */\n  --bg:            var(--earth-50);\n  --bg-sunk:       var(--earth-100);\n  --surface:       var(--earth-0);\n  --surface-2:     var(--earth-100);\n  --surface-inset: var(--earth-200);\n  --surface-invert:var(--ash-800);      /* dark Marathon panels */\n  --surface-invert-2:var(--ash-700);\n\n  --text:          var(--ash-800);\n  --text-muted:    var(--ash-500);\n  --text-faint:    var(--ash-300);\n  --text-invert:   var(--earth-50);\n  --text-invert-muted: var(--ash-200);\n  --text-on-pop:   var(--ash-900);      /* dark text on yellow/blush */\n\n  --ink:           var(--ash-800);      /* hard graphic borders + shadows */\n  --paper:         var(--earth-0);\n\n  --border:        #DED3BF;             /* soft earthy divider */\n  --border-strong: var(--ash-800);      /* hard Marathon outline */\n  --hairline:      rgba(35, 33, 28, 0.10);\n\n  --accent:        var(--crest-300);\n  --accent-press:  var(--crest-500);\n  --accent-2:      var(--cheek-300);\n  --accent-2-press:var(--cheek-500);\n  --accent-3:      var(--blush-300);\n  --accent-4:      var(--sky-300);\n  --accent-5:      var(--punch-300);\n  --accent-6:      var(--leaf-300);\n\n  --focus:         var(--cheek-300);\n  --link:          var(--cheek-400);\n\n  /* Rare decorative iridescence (the prism-through-the-window shot).\n     Use once per view, at most , never as a primary surface. */\n  --gradient-prism: linear-gradient(105deg,#F2D264 0%,#DD9C8D 28%,#9BB3C7 52%,#8FBFA8 74%,#EAC231 100%); /* @kind color */\n  /* deprecated , hazard stripes retired with the flat graphic pivot; kept so legacy markup doesn't break */\n  --stripe-hazard: repeating-linear-gradient(-45deg, var(--ink) 0 10px, transparent 10px 20px); /* @kind color */\n  --stripe-hazard-crest: repeating-linear-gradient(-45deg, var(--crest-300) 0 12px, var(--ink) 12px 24px); /* @kind color */\n}\n\n/* ============================================================\n   TYPOGRAPHY , families, scale, weights, leading, tracking\n   ============================================================ */\n\n:root {\n  /* ---------- families ---------- */\n  --font-display: \"Maison Display\", \"Space Grotesk\", ui-sans-serif, sans-serif;\n  --font-sans:    \"Space Grotesk\", ui-sans-serif, system-ui, -apple-system, sans-serif;\n  --font-label:   \"Karrik\", \"Space Grotesk\", ui-sans-serif, sans-serif;\n  /* deprecated alias , Space Mono is gone; old --font-mono refs resolve to Karrik */\n  --font-mono:    var(--font-label);\n\n  /* ---------- size scale (px) ---------- */\n  --text-2xs:  11px;\n  --text-xs:   12px;\n  --text-sm:   14px;\n  --text-base: 16px;\n  --text-md:   18px;\n  --text-lg:   21px;\n  --text-xl:   26px;\n  --text-2xl:  33px;\n  --text-3xl:  44px;\n  --text-4xl:  60px;\n  --text-5xl:  82px;\n  --text-6xl:  112px;\n  --text-7xl:  152px;\n\n  /* fluid display sizes for hero type */\n  --display-hero: clamp(56px, 11vw, 152px); /* @kind font */\n  --display-lg:   clamp(40px, 7vw, 92px);   /* @kind font */\n  --display-md:   clamp(30px, 4.5vw, 56px); /* @kind font */\n\n  /* ---------- weights (Space Grotesk 300-700; Maison is 400 only) ---------- */\n  --weight-light:   300;\n  --weight-regular: 400;\n  --weight-medium:  500;\n  --weight-semibold:600;\n  --weight-bold:    700;\n\n  /* ---------- line-height ---------- */\n  --leading-none:    1;\n  --leading-tight:   1.06;\n  --leading-snug:    1.18;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* ---------- letter-spacing ---------- */\n  --track-display: -0.04em;  /* Maison display type , always */\n  --track-tighter: -0.03em;\n  --track-tight:   -0.015em;\n  --track-normal:  0; /* @kind font */\n  --track-wide:    0.04em;\n  --track-wider:   0.12em;   /* deprecated , wide-tracked labels retired */\n  --track-widest:  0.22em;   /* deprecated , HUD caps retired */\n}\n\n/* ============================================================\n   SPACING & LAYOUT , 4px base grid\n   ============================================================ */\n\n:root {\n  --space-px: 1px;\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n  --space-40: 160px;\n  --space-48: 192px;\n\n  /* layout */\n  --gutter:          24px;\n  --page-pad:        clamp(20px, 5vw, 72px);\n  --container:       1240px;\n  --container-wide:  1480px;\n  --container-narrow:820px;\n\n  /* control heights (44px min touch target on primary controls) */\n  --control-sm: 34px;\n  --control-md: 44px;\n  --control-lg: 54px;\n\n  /* hairline / outline widths */\n  --line-hair:   1px;\n  --line-medium: 1.5px;\n  --line-bold:   2px;\n  --line-heavy:  3px;\n}\n\n/* ============================================================\n   RADII , none. The system is squared-off: modules, panels,\n   cards and controls all sit on hard 90° corners (modular\n   graphic look). Depth and softness come from colour alone ,\n   the system is flat; nothing is lifted.\n   The only circles allowed are functional indicator dots\n   (radio, LED status dots) , use --radius-round for those,\n   never for containers.\n   ============================================================ */\n\n:root {\n  --radius-none: 0;\n\n  /* semantic , all squared */\n  --radius-module:  0;   /* buttons / chips / colour modules */\n  --radius-control: 0;   /* inputs / selects / textareas */\n  --radius-card:    0;   /* cards / project tiles */\n  --radius-panel:   0;   /* structural panels / sections */\n\n  /* the single exception: round indicator dots (radio, LEDs) */\n  --radius-round: 999px;\n}\n\n/* ============================================================\n   SHADOWS , none. The system is FLAT: solid colour fields\n   meeting each other directly. Separation comes from colour\n   contrast and heavy ink rules, never from elevation, gloss,\n   or offsets. The old hard-offset \"sticker\" shadows are\n   DEPRECATED and resolve to none so legacy markup degrades\n   gracefully , do not use them in new work.\n   ============================================================ */\n\n:root {\n  --shadow-hard-sm: none;    /* deprecated */\n  --shadow-hard:    none;    /* deprecated */\n  --shadow-hard-lg: none;    /* deprecated */\n  --shadow-hard-crest: none; /* deprecated */\n  --shadow-hard-cheek: none; /* deprecated */\n\n  /* ---------- focus ring (kept , accessibility, not decoration) ---------- */\n  --ring-focus: 0 0 0 3px rgba(201,87,46,0.42);\n  --ring-focus-inset: inset 0 0 0 2px var(--cheek-300);\n}\n\n/* ============================================================\n   MOTION , snappy & mechanical, with an occasional plastic bounce\n   ============================================================ */\n\n:root {\n  --dur-instant: 80ms;  /* @kind other */\n  --dur-fast:    140ms; /* @kind other */\n  --dur:         220ms; /* @kind other */\n  --dur-slow:    360ms; /* @kind other */\n  --dur-slower:  560ms; /* @kind other */\n\n  --ease-standard:  cubic-bezier(0.4, 0, 0.2, 1);      /* @kind other */\n  --ease-out:       cubic-bezier(0.16, 1, 0.3, 1);     /* @kind other */\n  --ease-in:        cubic-bezier(0.4, 0, 1, 1);        /* @kind other */\n  --ease-snap:      cubic-bezier(0.2, 0.9, 0.25, 1);   /* @kind other */\n  --ease-overshoot: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n\n  /* stock transitions */\n  --t-color:  color var(--dur-fast) var(--ease-standard), background-color var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard); /* @kind other */\n  --t-transform: transform var(--dur) var(--ease-snap); /* @kind other */\n  --t-all:    all var(--dur) var(--ease-snap); /* @kind other */\n}\n\n/* ============================================================\n   BASE , light, non-invasive element defaults + a11y.\n   Consumers linking styles.css inherit these. No utility soup;\n   decoration is oversized display type + solid colour blocks.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  font-weight: var(--weight-regular);\n  color: var(--text);\n  background-color: var(--bg);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6, p, figure { margin: 0; }\n\na { color: var(--link); text-decoration: none; }\na:hover { text-decoration: underline; text-underline-offset: 0.15em; }\n\nimg, svg, video, canvas { display: block; max-width: 100%; }\n\nbutton, input, select, textarea { font: inherit; color: inherit; }\n\n::selection { background: var(--crest-300); color: var(--ash-900); }\n\n:focus-visible {\n  outline: none;\n  box-shadow: var(--ring-focus);\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.01ms !important;\n    scroll-behavior: auto !important;\n  }\n}\n\n<\u002Fstyle>\n  <script src=\"9703d30e-b7c5-402b-9a3d-80b924ac3bc2\"><\u002Fscript>\n  <style>\n    body { margin: 0; background: #F6F1E6; }\n    a { color: #AC4522; text-decoration: none; }\n    a:hover { color: #C9572E; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"padding: 80px 80px 0 80px; display: flex; flex-direction: column; gap: 10px; font-family: 'Space Grotesk', sans-serif; color: #23211C;\">\n  <h1 style=\"margin: 0; font-family: 'Maison Display', 'Space Grotesk', sans-serif; font-feature-settings: 'ss01'; letter-spacing: -0.04em; font-size: 84px; font-weight: 400; line-height: 1;\">Loading screen studies<\u002Fh1>\n  <p style=\"margin: 0; font-family: 'Karrik', sans-serif; font-size: 16px; color: #6C665A;\">eight series, ordered practical → experimental · numbers and glyphs · perfection synthétique<\u002Fp>\n<\u002Fdiv>\n<section ref=\"{{ root6Ref }}\" id=\"6\" style=\"padding: 80px 80px 24px 80px; display: flex; flex-direction: column; gap: 56px; font-family: 'Space Grotesk', sans-serif; color: #23211C;\">\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <h2 style=\"margin: 0; font-family: 'Maison Display', 'Space Grotesk', sans-serif; font-feature-settings: 'ss01'; letter-spacing: -0.04em; font-size: 48px; font-weight: 400; line-height: 1;\">Loading icons<\u002Fh2>\n    <p style=\"margin: 0; font-family: 'Karrik', sans-serif; font-size: 16px; color: #6C665A;\">series 01 · product , sixteen icon-scale loops, stepped and smooth, ready to ship<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 48px 40px; align-items: flex-start;\">\n\n    <div id=\"6a\" style=\"display: flex; flex-direction: column; gap: 12px;\">\n      <div data-screen-label=\"icon 6a , orbit square\" style=\"width: 250px; height: 250px; position: relative; overflow: hidden; background: #F6F1E6; border: 1px solid rgba(35,33,28,0.12); box-sizing: border-box; background-image: repeating-linear-gradient(0deg, rgba(35,33,28,0.05) 0 1px, transparent 1px 50px), repeating-linear-gradient(90deg, rgba(35,33,28,0.05) 0 1px, transparent 1px 50px);\">\n        <sc-for list=\"{{ icA }}\" as=\"pt\" hint-placeholder-count=\"8\">\n          <div data-ia-dot=\"\" style=\"position: absolute; width: 18px; height: 18px; background: rgba(35,33,28,0.1); left: {{ pt.left }}px; top: {{ pt.top }}px;\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 10px;\">\n        <span style=\"background: #23211C; color: #F6F1E6; font-family: 'Karrik', sans-serif; font-size: 13px; padding: 3px 10px;\"><a href=\"#6a\" style=\"color: #F6F1E6;\">6a<\u002Fa><\u002Fspan>\n        <span style=\"font-size: 15px;\">Orbit square<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"6b\" style=\"display: flex; flex-direction: column; gap: 12px;\">\n      <div data-screen-label=\"icon 6b , quarter turn\" style=\"width: 250px; height: 250px; position: relative; overflow: hidden; background: #F6F1E6; border: 1px solid rgba(35,33,28,0.12); box-sizing: border-box; background-image: repeating-linear-gradient(0deg, rgba(35,33,28,0.05) 0 1px, transparent 1px 50px), repeating-linear-gradient(90deg, rgba(35,33,28,0.05) 0 1px, transparent 1px 50px);\">\n        <sc-for list=\"{{ icB }}\" as=\"qd\" hint-placeholder-count=\"4\">\n          <div data-ib-q=\"\" style=\"position: absolute; width: 44px; height: 44px; background: #23211C; left: {{ qd.left }}px; top: {{ qd.top }}px;\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 10px;\">\n        <span style=\"background: #23211C; color: #F6F1E6; font-family: 'Karrik', sans-serif; font-size: 13px; padding: 3px 10px;\"><a href=\"#6b\" style=\"color: #F6F1E6;\">6b<\u002Fa><\u002Fspan>\n        <span style=\"font-size: 15px;\">Quarter turn<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"6c\" style=\"display: flex; flex-direction: column; gap: 12px;\">\n      <div data-screen-label=\"icon 6c , bar wave\" style=\"width: 250px; height: 250px; position: relative; overflow: hidden; background: #F6F1E6; border: 1px solid rgba(35,33,28,0.12); box-sizing: border-box; background-image: repeating-linear-gradient(0deg, rgba(35,33,28,0.05) 0 1px, transparent 1px 50px), repeating-linear-gradient(90deg, rgba(35,33,28,0.05) 0 1px, transparent 1px 50px);\">\n        <sc-for list=\"{{ icC }}\" as=\"br\" hint-placeholder-count=\"3\">\n          <div data-ic-bar=\"\" style=\"position: absolute; left: 80px; height: 16px; width: 36px; background: #23211C; top: {{ br.top }}px;\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 10px;\">\n        <span style=\"background: #23211C; color: #F6F1E6; font-family: 'Karrik', sans-serif; font-size: 13px; padding: 3px 10px;\"><a href=\"#6c\" style=\"color: #F6F1E6;\">6c<\u002Fa><\u002Fspan>\n        <span style=\"font-size: 15px;\">Bar wave<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"6d\" style=\"display: flex; flex-direction: column; gap: 12px;\">\n      <div data-screen-label=\"icon 6d , split breathe\" style=\"width: 250px; height: 250px; position: relative; overflow: hidden; background: #F6F1E6; border: 1px solid rgba(35,33,28,0.12); box-sizing: border-box; background-image: repeating-linear-gradient(0deg, rgba(35,33,28,0.05) 0 1px, transparent 1px 50px), repeating-linear-gradient(90deg, rgba(35,33,28,0.05) 0 1px, transparent 1px 50px);\">\n        <sc-for list=\"{{ icD }}\" as=\"qd\" hint-placeholder-count=\"4\">\n          <div data-id-q=\"\" style=\"position: absol
